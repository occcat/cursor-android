name: Android checks
on:
  pull_request:
    paths:
      - 'app/**'
      - 'gradle/**'
      - '*.gradle.kts'
      - 'gradle.properties'
      - '.github/workflows/android.yml'
  push:
    branches: [main]
    paths:
      - 'app/**'
      - 'gradle/**'
      - '*.gradle.kts'
      - 'gradle.properties'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'
      - uses: gradle/actions/setup-gradle@v4
      - name: Unit tests, lint and debug build
        run: ./gradlew :app:testDebugUnitTest :app:lintDebug :app:assembleDebug
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-reports
          path: app/build/reports/
  device:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        env:
          SCREENSHOT_ARGS: "-Pandroid.testInstrumentationRunnerArguments.class=\
            app.cursor.android.NativeExperienceTest,app.cursor.android.WidgetExperienceTest"
        with:
          api-level: 36
          arch: x86_64
          disable-animations: true
          # The first run keeps the default verification display. The screenshot runs use
          # 1080x1920 at 540 dpi (320 dp wide) and repeat in light and dark mode; WindowManager
          # caps forced sizes at three times the 640 px skin, so a taller request has no effect.
          # Each line runs separately; leaf pull targets must not exist beforehand. The full
          # run's report is restored afterwards so device-reports keeps every test class.
          script: |
            ./gradlew :app:connectedDebugAndroidTest
            cp -r app/build/reports/androidTests app/build/full-device-reports
            adb shell wm size 1080x1920
            adb shell wm density 540
            adb shell cmd uimode night no
            adb shell rm -rf /sdcard/cursor-android-qa-v2 /sdcard/cursor-android-widgets-qa
            ./gradlew :app:connectedDebugAndroidTest $SCREENSHOT_ARGS
            mkdir -p app/build/qa-screens/light app/build/qa-screens/dark
            adb pull /sdcard/cursor-android-qa-v2 app/build/qa-screens/light/native
            adb pull /sdcard/cursor-android-widgets-qa app/build/qa-screens/light/widgets
            adb shell cmd uimode night yes
            adb shell rm -rf /sdcard/cursor-android-qa-v2 /sdcard/cursor-android-widgets-qa
            ./gradlew :app:connectedDebugAndroidTest $SCREENSHOT_ARGS
            adb pull /sdcard/cursor-android-qa-v2 app/build/qa-screens/dark/native
            adb pull /sdcard/cursor-android-widgets-qa app/build/qa-screens/dark/widgets
            rm -rf app/build/reports/androidTests
            mv app/build/full-device-reports app/build/reports/androidTests
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: device-reports
          path: app/build/reports/androidTests/
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: device-screens
          path: app/build/qa-screens/
